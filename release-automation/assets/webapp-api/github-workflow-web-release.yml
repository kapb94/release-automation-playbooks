name: Build and Publish Web/API Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Tag de Release (ej. v1.2.0 o v1.2.0-rc.1)'
        required: true
        default: 'v1.0.0-rc.1'

permissions:
  contents: write

jobs:
  release-web:
    name: Build & Publish Web Release Artifact
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare Release Metadata
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.release_tag }}"
          else
            TAG="${{ github.ref_name }}"
          fi

          if [[ "$TAG" == *-* ]]; then
            CHANNEL="rc"
            ID_PREFIX="RC"
            IS_PRERELEASE="true"
          else
            CHANNEL="stable"
            ID_PREFIX="REL"
            IS_PRERELEASE="false"
          fi

          SHORT_SHA="$(git rev-parse --short HEAD)"
          TIMESTAMP="$(date -u +"%Y%m%d-%H%M%S")"
          ISO_UTC="$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          DEPLOYMENT_ID="${ID_PREFIX}-${TAG}-${SHORT_SHA}-${TIMESTAMP}"

          echo "release_tag=${TAG}" >> $GITHUB_OUTPUT
          echo "channel=${CHANNEL}" >> $GITHUB_OUTPUT
          echo "commit_sha=${SHORT_SHA}" >> $GITHUB_OUTPUT
          echo "deployment_id=${DEPLOYMENT_ID}" >> $GITHUB_OUTPUT
          echo "published_utc=${ISO_UTC}" >> $GITHUB_OUTPUT
          echo "is_prerelease=${IS_PRERELEASE}" >> $GITHUB_OUTPUT

      # Adapta este paso segun tu stack (Node/React, PHP/Composer, .NET Web API)
      - name: Install Dependencies & Build
        run: |
          echo "Ejecutando build y tests del proyecto..."
          # Ejemplo Node.js / Frontend:
          # npm ci && npm test && npm run build
          # Ejemplo PHP / Laravel:
          # composer install --no-dev --optimize-autoloader --no-interaction

      - name: Generate release-manifest.json and Package Tarball
        id: package
        run: |
          cat > release-manifest.json <<EOF
          {
            "releaseTag": "${{ steps.meta.outputs.release_tag }}",
            "channel": "${{ steps.meta.outputs.channel }}",
            "deploymentId": "${{ steps.meta.outputs.deployment_id }}",
            "commitSha": "${{ steps.meta.outputs.commit_sha }}",
            "publishedAtUtc": "${{ steps.meta.outputs.published_utc }}",
            "installedAtLocal": ""
          }
          EOF

          TAR_NAME="webapp-${{ steps.meta.outputs.release_tag }}.tar.gz"
          tar --exclude='.git' --exclude='.github' --exclude='.env' --exclude='node_modules/.cache' \
              -czf "./${TAR_NAME}" .

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.release_tag }}
          name: "Release ${{ steps.meta.outputs.release_tag }} (${{ steps.meta.outputs.deployment_id }})"
          prerelease: ${{ steps.meta.outputs.is_prerelease == 'true' }}
          body: |
            ### Información del Despliegue Web / API
            - **Release Tag:** `${{ steps.meta.outputs.release_tag }}`
            - **Canal:** `${{ steps.meta.outputs.channel }}`
            - **Deployment ID:** `${{ steps.meta.outputs.deployment_id }}`
            - **Commit SHA:** `${{ steps.meta.outputs.commit_sha }}`
            - **Fecha Publicación (UTC):** `${{ steps.meta.outputs.published_utc }}`
          files: |
            ./webapp-${{ steps.meta.outputs.release_tag }}.tar.gz
            ./release-manifest.json
          generate_release_notes: true
